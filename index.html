<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Supplements | Catálogo Oficial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0d0d;
            color: #f5f5f5;
            line-height: 1.5;
            padding: 15px 12px 170px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            width: 100%;
        }

        header {
            text-align: center;
            padding: 15px 0 20px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .logo span {
            color: #00FF66;
        }

        .subtitle {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .category-section {
            margin-bottom: 28px;
        }

        .category-title {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: #00FF66;
            border-radius: 2px;
        }

        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .product-card {
            background: #161616;
            border-radius: 14px;
            padding: 14px;
            border: 1px solid #262626;
            display: flex;
            gap: 14px;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            position: relative;
        }

        .product-card.out-of-stock {
            opacity: 0.5;
        }

        .product-card:active {
            border-color: #00FF66;
            background-color: #1c1c1c;
        }

        .product-img-container {
            width: 85px;
            height: 85px;
            flex-shrink: 0;
            background-color: #202020;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid #333;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 4px;
        }

        .product-content {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            gap: 6px;
        }

        .product-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .product-desc {
            font-size: 12px;
            color: #999;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        .product-price {
            font-size: 17px;
            font-weight: 800;
            color: #00FF66;
        }

        .stock-tag {
            font-size: 10px;
            color: #888;
            font-weight: 600;
            margin-top: 2px;
        }

        /* Controls */
        .quantity-controls {
            display: flex;
            align-items: center;
            background: #222;
            border-radius: 8px;
            border: 1px solid #333;
            overflow: hidden;
        }

        .btn-qty {
            background: transparent;
            border: none;
            color: #00FF66;
            font-size: 18px;
            font-weight: 800;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .btn-qty:disabled {
            color: #444;
            cursor: not-allowed;
        }

        .btn-qty:not(:disabled):active {
            background: #333;
        }

        .qty-number {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            width: 24px;
            text-align: center;
        }

        .btn-add {
            background-color: #00FF66;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-add:disabled {
            background-color: #282828;
            color: #666;
            cursor: not-allowed;
        }

        .btn-add:not(:disabled):active {
            transform: scale(0.96);
            background-color: #00cc52;
        }

        /* Cart Floating Bar - ELEVADO */
        .cart-bar {
            position: fixed;
            bottom: 50px;
            left: 0;
            right: 0;
            background: #141414;
            border-top: 1px solid #2a2a2a;
            border-bottom: 1px solid #2a2a2a;
            padding: 14px 16px;
            display: flex;
            justify-content: center;
            z-index: 100;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.8);
        }

        .cart-bar-content {
            max-width: 480px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .cart-summary {
            display: flex;
            flex-direction: column;
        }

        .cart-count {
            font-size: 12px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
        }

        .cart-total {
            font-size: 20px;
